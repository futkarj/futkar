# Cloudflare Worker in front of futkar.com (from adobe/aem-cloudflare-prod-worker, same as namerohit.com).
# www.futkar.com 301s to futkar.com (in src/index.mjs).
# f3c824a30fadac2537b68f37afbeaad0 is filled in once futkar.com is added to Cloudflare (see GO-LIVE.md).
name = "futkar-site"
main = "src/index.mjs"
workers_dev = false
routes = [
  { pattern = "futkar.com/*", zone_id = "f3c824a30fadac2537b68f37afbeaad0" },
  { pattern = "www.futkar.com/*", zone_id = "f3c824a30fadac2537b68f37afbeaad0" },
]
account_id = "947f0a70b6a5524508e5f07f268a14ec"

compatibility_date = "2025-03-17"

[vars]
ORIGIN_HOSTNAME = "main--futkar--futkarj.aem.live"
PUSH_INVALIDATION = "disabled"
